name: Scenario simulations
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/**'
      - 'src/core/**'
      - 'tests/scenario_sim.gd'
      - '.github/workflows/scenarios.yml'
concurrency:
  group: scenario-sim-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [17, 42]
        scenario: [treasure_skirmish, mausoleum, living_museum, dreams_well, worm_hunts, underground_library, haunted_houses, the_keep, genie_in_the_bottle, silent_tower, complex_temple, sunken_streets, stacked_gatehouse, layered_silent_tower]
        include:
          - seed: 17
            scenario: red_king_squatter
          - seed: 17
            scenario: red_king_investigations
          - seed: 17
            scenario: red_king_veil
          - seed: 17
            scenario: red_king_back_into_fire
          - seed: 17
            scenario: red_king_demons_and_mad_man
          - seed: 17
            scenario: red_king_mind
          - seed: 17
            scenario: red_king_herded
          - seed: 17
            scenario: red_king_sinkhole
          - seed: 17
            scenario: red_king_hill
          - seed: 17
            scenario: red_king_tethers
          - seed: 17
            scenario: red_king_bridge
          - seed: 17
            scenario: red_king_ringworld
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error" import.log
      - name: Full scenario battle
        run: |
          set -o pipefail
          timeout 600s godot --headless -s tests/scenario_sim.gd -- ${{ matrix.scenario }} ${{ matrix.seed }} 2>&1 | tee simulation.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" simulation.log
          grep -q '^SCENARIO_RESULT|' simulation.log
          grep -q '^SCENARIO_PERFORMANCE|' simulation.log
      - name: Record scenario performance summary
        if: always()
        run: |
          if [ -f simulation.log ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          for line in Path("simulation.log").read_text(errors="replace").splitlines():
              if not line.startswith("SCENARIO_PERFORMANCE|"):
                  continue
              row = json.loads(line.split("|", 1)[1])
              p = row["performance"]
              print("### Scenario activation performance")
              print(f'{row["id"]} · seed {row["seed"]} · {row["activations"]} activations')
              print("| Mean | P95 | Maximum | Open checks | Edge checks |")
              print("|---:|---:|---:|---:|---:|")
              print(f'| {p["mean_ms"]:.1f} ms | {p["p95_ms"]:.1f} ms | {p["max_ms"]:.1f} ms | {p["open_checks"]} | {p["edge_checks"]} |')
              print(f'Slowest activation: {p["slowest"]}')
              if p["mean_ms"] > 250 or p["p95_ms"] > 500:
                  print("**Performance review recommended** (diagnostic threshold, not a rules failure).")
          PY
          fi
      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-${{ matrix.scenario }}-${{ matrix.seed }}
          path: simulation.log
          if-no-files-found: ignore
