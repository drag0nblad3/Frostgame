name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error" import.log
      - name: Unit tests
        run: |
          set -o pipefail
          set +e
          timeout 240s godot --headless -s tests/run_tests.gd >unit-tests.log 2>&1
          result=$?
          set -e
          # Keep repeated engine errors from flooding the GitHub log.
          head -c 24000 unit-tests.log
          printf '\n--- final diagnostics ---\n'
          tail -c 24000 unit-tests.log
          test "$result" -eq 0
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" unit-tests.log
      - name: Player interaction smoke test
        run: |
          set -o pipefail
          godot --headless -s tests/player_smoke.gd 2>&1 | tee player-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" player-smoke.log
      - name: Scenario briefing smoke test
        run: |
          set -o pipefail
          timeout 30s godot --headless -s tests/scenario_ui_smoke.gd 2>&1 | tee scenario-ui.log
          ! grep -E "SCRIPT ERROR|Parse Error" scenario-ui.log
      - name: Roster editor smoke test
        run: |
          set -o pipefail
          timeout 30s godot --headless -s tests/roster_smoke.gd 2>&1 | tee roster-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" roster-smoke.log
      - name: Campaign inventory smoke test
        run: |
          set -o pipefail
          timeout 30s godot --headless -s tests/inventory_smoke.gd 2>&1 | tee inventory-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" inventory-smoke.log
      - name: Title navigation smoke test
        run: |
          set -o pipefail
          timeout 30s godot --headless -s tests/title_smoke.gd 2>&1 | tee title-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" title-smoke.log
      - name: Layered gatehouse smoke test
        run: |
          set -o pipefail
          timeout 30s godot --headless -s tests/layered_demo_smoke.gd 2>&1 | tee layered-demo.log
          ! grep -E "SCRIPT ERROR|Parse Error" layered-demo.log
      - name: Layered skirmish interface smoke test
        run: |
          set -o pipefail
          timeout 60s godot --headless -s tests/layered_skirmish_smoke.gd 2>&1 | tee layered-skirmish.log
          ! grep -E "SCRIPT ERROR|Parse Error" layered-skirmish.log
      - name: Smoke run main scene
        run: |
          set -o pipefail
          godot --headless --quit-after 120 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error" smoke.log

  bake-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error" import.log
      - name: Generate and verify baked scenes
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a godot --rendering-method gl_compatibility --resolution 320x240 -s tools/bake_visuals.gd 2>&1 | tee bake.log
          ! grep -E "SCRIPT ERROR|Parse Error|Visual bake failed" bake.log
      - uses: actions/upload-artifact@v4
        with:
          name: Frostgame-baked-visuals
          path: |
            assets/baked/
            bake.log
          retention-days: 7
