name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.5.1
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and build tools
        run: |
          set -eu
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$manager" ]; then
            mkdir -p "$sdk/cmdline-tools"
            curl -fLsS --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          "$manager" --sdk_root="$sdk" "platform-tools" "platforms;android-35" "build-tools;$BUILD_TOOLS"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Install Godot and Android export template
        run: |
          set -euo pipefail
          tag="$GODOT_VERSION-stable"
          url="https://github.com/godotengine/godot/releases/download/$tag"
          curl -fLsS --retry 3 "$url/Godot_v${tag}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/Godot_v${tag}_linux.x86_64" /usr/local/bin/godot
          curl -fLsS --retry 3 "$url/Godot_v${tag}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          mkdir -p "$template_dir"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$template_dir"
          test -s "$template_dir/android_debug.apk"
          test -s "$template_dir/android_release.apk"
      - name: Configure SDK and debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.FROSTGAME_DEBUG_KEYSTORE_B64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.FROSTGAME_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          key="$RUNNER_TEMP/frostgame-debug.keystore"
          password="${DEBUG_KEYSTORE_PASSWORD:-android}"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$key"
          else
            keytool -genkeypair -keystore "$key" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
            password=android
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$key"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Import project
        run: |
          set -o pipefail
          godot --headless --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/import.log"
      - name: Export APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --export-debug Android "$PWD/build/Frostgame.apk" 2>&1 | tee "$RUNNER_TEMP/export.log"
          test -s build/Frostgame.apk
          ! grep -E "SCRIPT ERROR|Parse Error|Export failed" "$RUNNER_TEMP/export.log"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose build/Frostgame.apk
          # The legacy aapt badging parser rejects boolean manifest attributes in Godot 4.5.
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump xmltree build/Frostgame.apk AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -F "io.github.drag0nblad3.frostgame" "$RUNNER_TEMP/manifest.txt"
          unzip -Z1 build/Frostgame.apk > "$RUNNER_TEMP/apk-files.txt"
          grep -F "assets/data/" "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'assets/data/figures.json' "$RUNNER_TEMP/apk-files.txt"
          grep -Fxq 'assets/data/scenarios/underground_library.json' "$RUNNER_TEMP/apk-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Frostgame-Android
          path: build/Frostgame.apk
          if-no-files-found: error
          retention-days: 30
