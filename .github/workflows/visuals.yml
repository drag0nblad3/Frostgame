name: Visual previews
on:
  pull_request:
    paths: ['src/view/**', 'data/boards/**', 'data/visual_palettes.json', 'tools/capture.gd', 'tools/miniature_gallery.gd', 'tools/interface_capture.gd', 'assets/**', '.github/workflows/visuals.yml']
  workflow_dispatch:
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software GL
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - name: Import
        run: |
          set -euo pipefail
          godot --headless --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR|Parse Error' import.log; then exit 1; fi
      - name: Render miniatures and battlefields
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          mkdir -p previews
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/layered_capture.gd 2>&1 | tee gatehouse.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/layered_capture.gd -- tower 2>&1 | tee tower.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- previews/sunken-streets.png 0 sunken_streets 2>&1 | tee sunken.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/title_capture.gd -- previews/title.png 2>&1 | tee title.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/miniature_gallery.gd -- previews/miniatures.png 2>&1 | tee gallery.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/miniature_gallery.gd -- previews/bestiary.png bestiary 2>&1 | tee bestiary.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/miniature_gallery.gd -- previews/schools.png schools 2>&1 | tee schools.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1600x1000 -s tools/miniature_gallery.gd -- previews/apprentices.png apprentices 2>&1 | tee apprentices.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1600x1000 -s tools/miniature_gallery.gd -- previews/soldiers.png soldiers 2>&1 | tee soldiers.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1600x1000 -s tools/miniature_gallery.gd -- previews/beasts.png beasts 2>&1 | tee beasts.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1920x1200 -s tools/miniature_gallery.gd -- previews/supernatural.png supernatural 2>&1 | tee supernatural.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1920x1200 -s tools/miniature_gallery.gd -- previews/red-king-bestiary.png red_king 2>&1 | tee red-king-gallery.log
          test -s previews/red-king-bestiary.png
          if grep -E 'SCRIPT ERROR|Parse Error|Node not inside tree' red-king-gallery.log; then exit 1; fi
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- previews/frozen-ruins.png 0 treasure_skirmish 2>&1 | tee ruins.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- previews/complex-temple.png 0 complex_temple 2>&1 | tee temple.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- previews/library.png 0 underground_library 2>&1 | tee library.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- previews/well.png 0 dreams_well 2>&1 | tee well.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- previews/keep.png 0 the_keep 2>&1 | tee keep.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/interface_capture.gd -- previews/roster.png roster 2>&1 | tee roster.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/interface_capture.gd -- previews/headquarters.png campaign 2>&1 | tee headquarters.log
          if grep -E 'SCRIPT ERROR|Parse Error|Node not inside tree|Shader compilation failed|SHADER ERROR|Shader error' tower.log gatehouse.log sunken.log roster.log headquarters.log title.log gallery.log bestiary.log schools.log apprentices.log soldiers.log beasts.log supernatural.log ruins.log temple.log library.log well.log keep.log; then exit 1; fi
          grep -F 'scenario=treasure_skirmish board=frozen_ruins' ruins.log
          grep -F 'scenario=complex_temple board=complex_temple' temple.log
          grep -F 'scenario=underground_library board=underground_library' library.log
          grep -F 'scenario=dreams_well board=dreams_well' well.log
          grep -F 'scenario=the_keep board=the_keep' keep.log
          for file in tower-upper tower-cutaway gatehouse-upper gatehouse-cutaway sunken-streets roster headquarters title miniatures bestiary schools apprentices soldiers beasts supernatural frozen-ruins complex-temple library well keep; do test -s "previews/$file.png"; done
      - name: Capture Red King encounter art
        run: |
          set -euo pipefail
          for scenario in red_king_back_into_fire red_king_sinkhole red_king_mind red_king_ringworld; do
            timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- "previews/$scenario.png" 0 "$scenario" 2>&1 | tee "$scenario.log"
            test -s "previews/$scenario.png"
            if grep -E 'SCRIPT ERROR|Parse Error|Node not inside tree|Shader compilation failed' "$scenario.log"; then exit 1; fi
          done
      - name: Capture Reality Crack hazards
        run: |
          set -euo pipefail
          for effect in 13 16; do
            timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1280x720 -s tools/capture.gd -- "previews/reality-crack-$effect.png" 0 red_king_squatter "$effect" 2>&1 | tee "reality-crack-$effect.log"
            test -s "previews/reality-crack-$effect.png"
            if grep -E 'SCRIPT ERROR|Parse Error|Node not inside tree|Shader compilation failed' "reality-crack-$effect.log"; then exit 1; fi
          done
      - name: Capture scenario environment refinements
        run: |
          set -o pipefail
          for scenario in haunted_houses mausoleum living_museum; do
            timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1560x720 -s tools/capture.gd -- "previews/$scenario.png" 0 "$scenario" 2>&1 | tee "$scenario.log"
            ! grep -E "SCRIPT ERROR|Parse Error|Shader compilation failed" "$scenario.log"
            test -s "previews/$scenario.png"
          done
      - name: Capture phone landscape and portrait UI
        run: |
          set -o pipefail
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1560x720 -s tools/interface_capture.gd -- previews/phone-maps.png maps 2>&1 | tee phone-maps.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1560x720 -s tools/interface_capture.gd -- previews/phone-roster.png roster 2>&1 | tee phone-roster.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 720x1560 -s tools/interface_capture.gd -- previews/portrait-maps.png maps 2>&1 | tee portrait-maps.log
          ! grep -E "SCRIPT ERROR|Parse Error" phone-maps.log phone-roster.log portrait-maps.log
          timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1560x720 -s tools/interface_capture.gd -- previews/phone-guide.png guide 2>&1 | tee phone-guide.log
          ! grep -E "SCRIPT ERROR|Parse Error" phone-guide.log
          for file in phone-maps phone-roster portrait-maps phone-guide; do test -s "previews/$file.png"; done
      - name: Capture compact phone warband editor
        run: |
          set -o pipefail
          for tab in spells recruits wizard full-roster; do
            timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1560x720 -s tools/interface_capture.gd -- "previews/phone-$tab.png" "$tab" 2>&1 | tee "$tab.log"
            ! grep -E "SCRIPT ERROR|Parse Error" "$tab.log"
            test -s "previews/phone-$tab.png"
          done
      - name: Capture portrait workshop
        run: |
          set -o pipefail
          for tab in roster wizard spells recruits; do
            timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 720x1560 -s tools/interface_capture.gd -- "previews/portrait-$tab.png" "$tab" 2>&1 | tee "portrait-$tab.log"
            ! grep -E "SCRIPT ERROR|Parse Error" "portrait-$tab.log"
            test -s "previews/portrait-$tab.png"
          done
      - name: Capture expedition launch screens
        run: |
          set -o pipefail
          for orientation in 1560x720 720x1560; do
            for page in home skirmish campaign; do
              timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution "$orientation" -s tools/title_capture.gd -- "previews/launch-$orientation-$page.png" "$page" 2>&1 | tee "launch-$orientation-$page.log"
              ! grep -E "SCRIPT ERROR|Parse Error|Node not inside tree" "launch-$orientation-$page.log"
              test -s "previews/launch-$orientation-$page.png"
            done
          done
      - name: Capture unified campaign and reference pages
        run: |
          set -o pipefail
          for page in campaign equipment rituals base chronicle guide graphics inspector briefing; do
            timeout 120s xvfb-run -a godot --audio-driver Dummy --rendering-method gl_compatibility --resolution 1560x720 -s tools/interface_capture.gd -- "previews/menu-$page.png" "$page" 2>&1 | tee "menu-$page.log"
            ! grep -E "SCRIPT ERROR|Parse Error|Node not inside tree" "menu-$page.log"
            test -s "previews/menu-$page.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frostgame-Visual-Previews
          path: previews/
